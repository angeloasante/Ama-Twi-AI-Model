name: Keep Modal Warm

on:
  schedule:
    # Run every 4 minutes to keep container warm (5 min idle timeout)
    - cron: '*/4 * * * *'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Modal Health Endpoint
        run: |
          echo "Pinging Modal to keep warm..."
          curl -s -o /dev/null -w "Status: %{http_code}, Time: %{time_total}s\n" \
            https://angeloasante--twi-ai-agent-v3-health.modal.run
          echo "Done!"
