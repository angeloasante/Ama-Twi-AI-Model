name: Keep Modal Warm

on:
  schedule:
    # Run every 5 minutes to keep container warm
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Manual trigger for testing
  push:
    branches: [main]  # Run on push to verify workflow works

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Modal Health Endpoint
        run: |
          echo "Pinging Modal to keep warm..."
          curl -s -o /dev/null -w "Status: %{http_code}, Time: %{time_total}s\n" \
            https://angeloasante--twi-ai-agent-v3-twiagent-agent.modal.run
          echo "Done!"
